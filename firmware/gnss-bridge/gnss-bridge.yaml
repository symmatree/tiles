# gnss-bridge -- Olimex ESP32-POE-ISO-EA (Rev L) as a UART-to-TCP bridge for the attic
# ZED-F9P. See README.md in this directory for the wiring and why the pins are these pins.
#
# This device holds no GNSS logic. It moves bytes between the receiver's UART1 and one TCP
# client, which is rtkbase's str2str_tcp. Everything that understands GNSS -- RTCM generation,
# the base coordinate, the caster -- stays in tanka/environments/ntrip/.

substitutions:
  name: gnss-bridge
  # Must match [main] ext_tcp_port in tanka/environments/ntrip/settings.conf.
  stream_port: "6638"
  # Must match CFG-UART1-BAUDRATE on the receiver (firmware/gnss-bridge/receiver-config.py).
  uart_baud: "460800"

esphome:
  name: ${name}
  friendly_name: GNSS bridge (attic)

esp32:
  board: esp32-poe-iso
  framework:
    type: esp-idf

# Ethernet only -- no WiFi. GPIO consumed here: 12, 17, 18, 23, plus the ESP32 EMAC's fixed
# RMII pins (19, 21, 22, 25, 26, 27), which are not configurable.
ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    pin: GPIO17
    mode: CLK_OUT
  phy_addr: 0
  power_pin: GPIO12

logger:
  # The UART carries binary UBX; never log it, and keep the console off UART0 so a serial
  # cable cannot interleave with it.
  baud_rate: 0
  level: INFO

api:
ota:
  - platform: esphome

external_components:
  - source: github://oxan/esphome-stream-server
    components: [stream_server]

# UART1 to the receiver. TX -> breakout RX/MOSI, RX <- breakout TX/MISO.
# GPIO36 is input-only, which is all an RX line needs, and it reaches the header on EXT2 pin 2
# without the series Schottky that sits on the UEXT RX pin.
uart:
  id: gnss_uart
  tx_pin: GPIO4
  rx_pin: GPIO36
  baud_rate: ${uart_baud}
  # ~5 KiB/s of RAWX/SFRBX with ephemeris bursts on top. The default 256 is not enough at
  # this rate; the receiver has no flow control and drops whole messages if its own TX buffer
  # fills, so the slack belongs on this side.
  rx_buffer_size: 4096

stream_server:
  uart_id: gnss_uart
  port: ${stream_port}
  # Power of two, per the component. 128 is the default and is sized for a thermostat.
  buffer_size: 2048

i2c:
  sda: GPIO13
  scl: GPIO16
  scan: true

sensor:
  # The attic has never had an ambient measurement -- acebase exposed only a CPU die sensor and
  # a static acpitz value, so the temperature record in docs/bare-metal-nodes.md is a proxy.
  # Mount this on a short lead away from the board: the ESP32 and PHY dissipate enough to bias
  # a board-mounted part by several degrees, which is the same confound.
  - platform: sht4x
    temperature:
      name: Attic temperature
    humidity:
      name: Attic humidity
    update_interval: 60s

  - platform: uptime
    name: Uptime

  # Zero clients means str2str is not connected, and the bridge is discarding receiver bytes.
  - platform: stream_server
    connection_count:
      name: Stream clients

binary_sensor:
  - platform: stream_server
    connected:
      name: Stream connected
