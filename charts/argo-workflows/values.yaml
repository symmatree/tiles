# Argo Workflows, for jobs that want their own pod rather than someone else's process.
#
# Cluster-wide machinery, deliberately. Workflows run in whatever namespace the work
# naturally belongs to rather than being funnelled into one -- a converge belongs with
# fleet-control, where its SSH key and config already are, and routing it elsewhere would
# mean a second copy of that key in a second namespace.
#
# First consumer is coordinator#504, but not the only one: this is here as general
# machinery for jobs, not as an implementation detail of that issue.

argo-workflows:
  # NOT ON LANCER. lancer is where Seth runs notebooks and mapping jobs, and its headroom
  # exists so that those large allocations succeed -- not as a place to push workloads off
  # the machines that exist to serve. Putting it back needs his express approval, not a
  # values edit.
  #
  # IT TAKES THE AFFINITY, NOT JUST THE MISSING TOLERATION. lancer's taint is
  # `dedicated=heavy:PreferNoSchedule` -- `tf/nodes/prod.tfvars` sets `taint = "heavy"` and
  # `taint_effect = "PreferNoSchedule"` on the following line, and the module renders
  # `dedicated=${taint}:${taint_effect}`. Prefer, not NoSchedule: so having no toleration
  # is only a hint, and the scheduler will still place here when it likes the node. The
  # `nodeAffinity` below is what actually holds. (Comments in `tanka/environments/odm` and
  # `charts/jupyterhub/values-tiles.yaml` say NoSchedule; they are stale, and the tfvars is
  # the thing that runs.)
  #
  # It stays correct if the taint is ever made hard -- then it is merely redundant.
  #
  # Applies to the controller and the server. A workflow's own pods are a separate
  # question, decided per workflow by whoever writes it.
  #
  # Nothing else is pinned. `tiles-wk-1` is full (19 MiB unrequested) so the scheduler
  # skips it, `tiles-wk-3` has the room (3.0 GiB unrequested, 36% used), and naming a node
  # here would only go stale.

  # CRDs come from the bootstrap layer, not from this chart, like every other CRD-bearing
  # component here: ci-tools/crd-charts/sources.yaml builds them and
  # tf/nodes/k8s-bootstrap.tf installs them. The reason is in sources.yaml -- Helm never
  # upgrades or deletes anything in a chart's crds/, so a CRD parked there can only ever be
  # created once.
  crds:
    install: false

  controller:
    # No `workflowNamespaces`: the controller watches the whole cluster, which is what
    # lets a workflow live next to the thing it is for. The ClusterRole this implies --
    # pods create/exec, secrets get -- is the normal grant for cluster-wide machinery,
    # and is not a step up on a cluster where Argo CD already applies arbitrary manifests
    # everywhere.
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    - lancer

  server:
    # On. This is the thing that makes a workflow engine usable by a person -- what ran,
    # what it did, why it stopped, and the logs without knowing the pod name first.
    enabled: true
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    - lancer
    # Same posture as the other UIs on this cluster (fleet-control, Grafana): reachable on
    # the internal network over TLS, with no separate login in front. `server` auth mode
    # means the UI acts as the server's own ServiceAccount rather than asking the browser
    # for credentials, which matches that.
    authModes:
      - server
    ingress:
      enabled: true
      ingressClassName: cilium
      annotations:
        cert-manager.io/cluster-issuer: real-cert
      hosts:
        - argo.tiles.symmatree.com
      # Prefix rather than the chart's ImplementationSpecific, which under Cilium matches
      # only the exact "/" and 404s everything below it.
      paths:
        - /
      pathType: Prefix
      tls:
        - secretName: argo-workflows-server-tls
          hosts:
            - argo.tiles.symmatree.com

  # ARTIFACT REPOSITORY: deliberately not set here, because there is nothing to point it
  # at yet. Loki and Mimir both run `minio: enabled: false` against filesystem PVCs, so
  # this cluster has no S3-compatible endpoint and no bucket. Standing up one is its own
  # decision -- see tiles#827 -- and until it is made, workflows pass data between steps
  # with volumes and leave their record in the step's pod log, which Alloy collects into
  # Loki.
