# Started from
# https://raw.githubusercontent.com/kubernetes-sigs/external-dns/refs/tags/external-dns-helm-chart-1.16.1/charts/external-dns/values.yaml

external-dns:
  # 14-day p85 157, p99 157 (Mimir). Sizing rule: charts/cert-manager/values.yaml.
  resources:
    requests:
      memory: 160Mi
  serviceMonitor:
    enabled: true
  tolerations:
    - effect: NoSchedule
      key: node-role.kubernetes.io/control-plane
      operator: Exists
  nodeSelector:
    kubernetes.io/os: linux
    node-role.kubernetes.io/control-plane: ""
  logFormat: text # @schema enum:["text", "json"]; type:string; default: "text"
  # -- Interval for DNS updates.
  interval: 1m
  # -- How DNS records are synchronized between sources and providers; available values are `sync` & `upsert-only`.
  # sync (not upsert-only): upsert-only never deletes, so a record-type change
  # (e.g. an A -> CNAME flip, as the front-door WAN cutover does) silently fails
  # -- it needs delete-then-create. sync does that, and only ever touches records
  # this instance owns (txt registry, txtOwnerId = cluster name), so it will not
  # delete the UniFi/Cloudflare lhitw record or any hand-made records.
  policy: sync # @schema enum:[sync, upsert-only]; type:string; default: "upsert-only"
  # -- Specify the registry for storing ownership and labels.
  # Valid values are `txt`, `aws-sd`, `dynamodb` & `noop`.
  registry: txt # @schema enum:[txt, aws-sd, dynamodb, noop]; default: "txt"
  # -- (string) Specify an identifier for this instance of _ExternalDNS_ wWhen using a registry other than `noop`.
  txtOwnerId: "placeholder-cluster-name"
  # -- Limit possible target zones by domain suffixes.
  domainFilters:
    - "placeholder-cluster-name.symmatree.com"
    - 0.10.in-addr.arpa
  provider:
    name: google
  extraArgs:
    - --google-project=placeholder-project-id
    # Exclude ACME challenge domains (contain underscores, not valid IDNA)
    - --regex-domain-exclusion=^_acme-challenge\.
    # external-dns v0.22.0 moved the default --annotation-prefix from
    # external-dns.alpha.kubernetes.io/ to external-dns.kubernetes.io/, which it
    # does not read unless this flag is set. Every annotation here now uses the
    # new prefix, so this flag covers only the propagation gap: until each child
    # app has resynced, some live objects still carry the alpha prefix, and an
    # annotation external-dns cannot see is not inert -- under policy: sync a
    # `target` annotation going missing reverts the host from CNAME lhitw to an
    # A record at the internal ingress VIP (unreachable from the internet) and a
    # `hostname`-only record is deleted. Drop the flag once every object in
    # `kubectl get ingress,svc -A -o json` carries the new prefix; upstream will
    # remove it in a later release regardless. See docs/remote-access.md.
    - --enable-legacy-annotation-prefix
  env:
    - name: GOOGLE_APPLICATION_CREDENTIALS
      value: /etc/secrets/service-account/credential.json
  extraVolumeMounts:
    - name: google-service-account
      mountPath: /etc/secrets/service-account/
  extraVolumes:
    - name: google-service-account
      secret:
        secretName: clouddns-sa
