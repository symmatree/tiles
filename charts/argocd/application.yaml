apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
spec:
  project: '{{ required ".Values.cluster_name is required" .Values.cluster_name }}'
  sources:
    - repoURL: https://github.com/symmatree/tiles.git
      targetRevision: '{{ required ".Values.targetRevision is required" .Values.targetRevision }}'
      path: charts/argocd
      helm:
        valueFiles:
          - values.yaml
          - $values/charts/argocd-applications/values/argocd-values.yaml
          - $values/charts/argocd-applications/values/argocd-{{ required ".Values.cluster_name is required" .Values.cluster_name }}-values.yaml
        valuesObject:
          targetRevision: '{{ required ".Values.targetRevision is required" .Values.targetRevision }}'
          cluster_name: '{{ required ".Values.cluster_name is required" .Values.cluster_name }}'
          vault_name: '{{ required ".Values.vault_name is required" .Values.vault_name }}'
          argo-cd:
            global:
              domain: 'argocd.{{ required ".Values.cluster_name is required" .Values.cluster_name }}.symmatree.com'
            server:
              ingressGrpc:
                hostname: 'grpc-argocd.{{ required ".Values.cluster_name is required" .Values.cluster_name }}.symmatree.com'
          oauth2-proxy:
            ingress:
              hosts:
                - 'argocd.{{ required ".Values.cluster_name is required" .Values.cluster_name }}.symmatree.com'
              tls:
                - secretName: argocd-proxy-tls
                  hosts:
                    - 'argocd.{{ required ".Values.cluster_name is required" .Values.cluster_name }}.symmatree.com'
    - repoURL: https://github.com/symmatree/tiles.git
      targetRevision: '{{ required ".Values.targetRevision is required" .Values.targetRevision }}'
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # Terraform installs this chart, so every live resource carries Helm's
  # ownership stamps and none carries Argo's. Argo injects its tracking-id into
  # the target and Helm writes its three onto the live object; neither renderer
  # emits the other's, so all 56 resources read OutOfSync forever on a freshly
  # Terraform-built cluster. Read off the Argo API (managed-resources) on
  # tiles-test: the entire diff is these four metadata keys -- no spec
  # difference at all, and a rendered-vs-live comparison of cilium-config
  # matched 202/202 keys.
  #
  # Ignoring them keeps drift detection armed for everything that matters: a
  # changed image, ConfigMap datum or Service port still trips OutOfSync. The
  # tracking-id entry is deliberate -- Terraform owns these releases, so
  # whether Argo's ownership mark is present is not a fact worth alerting on.
  ignoreDifferences:
    - group: "*"
      kind: "*"
      jsonPointers:
        - /metadata/annotations/argocd.argoproj.io~1tracking-id
        - /metadata/annotations/meta.helm.sh~1release-name
        - /metadata/annotations/meta.helm.sh~1release-namespace
        - /metadata/labels/app.kubernetes.io~1managed-by
  syncPolicy:
    # No automated sync: Terraform installs this chart (tf/nodes/k8s-argocd.tf).
    # Argo CD still renders, diffs and reports drift on itself -- it just does
    # not correct it, so it cannot fight the installer. Syncing is manual.
    # No CreateNamespace/managedNamespaceMetadata either: Terraform owns the
    # namespace, which has to exist before the release goes into it.
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
