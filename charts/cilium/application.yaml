apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
spec:
  project: '{{ required ".Values.cluster_name is required" .Values.cluster_name }}'
  sources:
    - repoURL: https://github.com/symmatree/tiles.git
      targetRevision: '{{ required ".Values.targetRevision is required" .Values.targetRevision }}'
      path: charts/cilium
      helm:
        valueFiles:
          - values.yaml
          - $values/charts/argocd-applications/values/cilium-values.yaml
          - $values/charts/argocd-applications/values/cilium-{{ required ".Values.cluster_name is required" .Values.cluster_name }}-values.yaml
        valuesObject:
          cilium:
            ipv4NativeRoutingCIDR: '{{ required ".Values.pod_cidr is required" .Values.pod_cidr }}'
            cluster:
              name: '{{ required ".Values.cluster_name is required" .Values.cluster_name }}'
            hubble:
              tls:
                auto:
                  certManagerIssuerRef:
                    name: '{{ required ".Values.cluster_name is required" .Values.cluster_name }}-ca-issuer'
              ui:
                ingress:
                  hosts:
                    - 'hubble.{{ required ".Values.cluster_name is required" .Values.cluster_name }}.symmatree.com'
                  tls:
                    - secretName: hubble-ui-tls
                      hosts:
                        - 'hubble.{{ required ".Values.cluster_name is required" .Values.cluster_name }}.symmatree.com'
    - repoURL: https://github.com/symmatree/tiles.git
      targetRevision: '{{ required ".Values.targetRevision is required" .Values.targetRevision }}'
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cilium
  # Terraform installs this chart, so every live resource carries Helm's
  # ownership stamps and none carries Argo's. Argo injects its tracking-id into
  # the target and Helm writes its three onto the live object; neither renderer
  # emits the other's, so all 56 resources read OutOfSync forever on a freshly
  # Terraform-built cluster. Read off the Argo API (managed-resources) on
  # tiles-test: the entire diff is these four metadata keys -- no spec
  # difference at all, and a rendered-vs-live comparison of cilium-config
  # matched 202/202 keys.
  #
  # Ignoring them keeps drift detection armed for everything that matters: a
  # changed image, ConfigMap datum or Service port still trips OutOfSync. The
  # tracking-id entry is deliberate -- Terraform owns these releases, so
  # whether Argo's ownership mark is present is not a fact worth alerting on.
  ignoreDifferences:
    - group: "*"
      kind: "*"
      jsonPointers:
        - /metadata/annotations/argocd.argoproj.io~1tracking-id
        - /metadata/annotations/meta.helm.sh~1release-name
        - /metadata/annotations/meta.helm.sh~1release-namespace
        - /metadata/labels/app.kubernetes.io~1managed-by
  syncPolicy:
    # No automated sync: Terraform installs this chart (tf/nodes/k8s-cilium.tf),
    # and two writers on the CNI is worse than drift you can see. Argo CD keeps
    # the Application so it still renders, diffs and reports; syncing is manual.
    # No CreateNamespace/managedNamespaceMetadata either -- Terraform owns the
    # namespace, because it has to exist before the release goes in.
    syncOptions:
      - ServerSideApply=true
