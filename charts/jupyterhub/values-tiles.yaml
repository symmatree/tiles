# Per-cluster overrides for tiles (prod).

# lancer (128 GB metal) is reserved for memory-intensive / big-image workloads
# via a taint `dedicated=heavy:NoSchedule` (declared in tf:
# metal_amd_nodes.lancer.taint / .taint_effect), so routine workload stays on
# wk-1/2/3 and lancer is reserved for notebooks / ODM.
# The singleuser belongs on lancer -- its ~4 GB image unpacks in containerd
# (podruntime/runtime) at node level, not bounded by any pod limit (see facts
# fables/Tiles/tiles-host-instability.md T-B1, issue #576) -- so it gets the
# nodeSelector (put it there) plus a matching toleration. Prod-only (test has no
# lancer).
jupyterhub:
  singleuser:
    nodeSelector:
      kubernetes.io/hostname: lancer
    extraTolerations:
      # No effect field on purpose: an effect-less toleration matches the key
      # and value under any effect, so this does not have to be re-edited when
      # the taint's effect changes (and there is no deploy-ordering race when
      # it does).
      - key: dedicated
        operator: Equal
        value: heavy
