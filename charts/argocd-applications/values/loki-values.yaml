# Static Loki chart values. Templated keys and extraObjects in loki-application.yaml valuesObject.

loki:
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: 2024-04-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  ingester:
    chunk_encoding: snappy
  pattern_ingester:
    enabled: true
  limits_config:
    volume_enabled: true
  tracing:
    enabled: true
  ruler:
    enable_api: true
  storage:
    type: "filesystem"
    filesystem:
      chunks_directory: /mnt/loki-nfs/chunks
      rules_directory: /mnt/loki-nfs/rules
  querier:
    max_concurrent: 4
  extraMemberlistConfig:
    cluster_label: loki

deploymentMode: SingleBinary

monitoring:
  dashboards:
    enabled: false
  serviceMonitor:
    enabled: true
  # The Loki mixin's recording rules and alerts, as PrometheusRules. Alloy's
  # cluster-wide mimir.rules.kubernetes loads them into the Mimir ruler, same path
  # as the other mixins (#655).
  rules:
    enabled: true
  alerts:
    enabled: true
  additionalPrometheusRules:
    # Canary coverage (#805). The DaemonSet's desired count is the node list: with the
    # toleration below it is every node. Pods that are not scheduled or not available are
    # already covered by KubeDaemonSetNotScheduled / KubeDaemonSetRolloutStuck.
    canary-coverage:
      groups:
        - name: loki-canary-coverage
          rules:
            - alert: LokiCanaryNotReporting
              expr: |
                (count(rate(loki_canary_entries_total[5m]) > 0) or on() vector(0))
                  < on() max(kube_daemonset_status_desired_number_scheduled{namespace="loki", daemonset="loki-canary"})
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: Fewer loki-canary pods are writing entries than the DaemonSet schedules.
            - alert: LokiCanaryMissingEntries
              expr: sum by (pod) (increase(loki_canary_missing_entries_total[15m])) > 0
              labels:
                severity: warning
              annotations:
                summary: "{{ $labels.pod }} wrote entries that did not come back from Loki."
            # From the grafana/loki chart's alerts through 6.55.0; the community chart's
            # mixin does not carry it.
            - alert: LokiCanaryLatency
              expr: |
                histogram_quantile(0.99, sum(rate(loki_canary_response_latency_seconds_bucket[5m])) by (le, namespace, job)) > 5
              for: 15m
              labels:
                severity: warning
              annotations:
                message: "{{ $labels.job }} is experiencing {{ printf \"%.2f\" $value }}s 99th percentile latency."

lokiCanary:
  # Run on every node, tainted ones included (control plane, acebase, lancer), like the
  # other node DaemonSets (#805).
  tolerations:
    - operator: Exists

singleBinary:
  replicas: 1
  # emptyDir for the WAL, not local-path: a local-path PV pins the pod to one
  # node (#766). Chunks and rules are on loki-loki-data (NFS). With persistence
  # off the chart mounts an emptyDir named storage at /var/loki.
  persistence:
    enabled: false
  extraArgs:
    - -config.expand-env=true
    - -log-config-reverse-order
  extraVolumes:
    - name: loki-shared-storage
      persistentVolumeClaim:
        claimName: loki-loki-data
  extraVolumeMounts:
    - name: loki-shared-storage
      mountPath: /mnt/loki-nfs

gateway:
  enabled: false

backend:
  replicas: 0

read:
  replicas: 0

write:
  replicas: 0

chunksCache:
  enabled: false

resultsCache:
  enabled: false

ingester:
  replicas: 0

querier:
  replicas: 0

queryFrontend:
  replicas: 0

queryScheduler:
  replicas: 0

distributor:
  replicas: 0

compactor:
  replicas: 0

indexGateway:
  replicas: 0

bloomGateway:
  replicas: 0
