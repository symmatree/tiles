# Static k8s-monitoring values. Templated/extraObjects in alloy-application.yaml valuesObject.

global:
  extraEnv:
    - name: SSL_CERT_FILE
      value: /etc/ssl/certs/ca-certificates.crt
  extraVolumes:
    - name: ca-certificates
      configMap:
        name: trust-bundle
  extraVolumeMounts:
    - name: ca-certificates
      mountPath: /etc/ssl/certs
      readOnly: true

clusterMetrics:
  enabled: true
  controlPlane:
    enabled: true
  apiServer:
    metricsTuning:
      includeMetrics:
        - apiserver_request_total
        - apiserver_request_sli_duration_seconds.*
        - apiserver_client_certificate_expiration_seconds.*
        - apiserver_request_terminations_total
        - aggregator_unavailable_apiservice.*
        - rest_client_requests_total
        - kubernetes_build_info
  kubeProxy:
    enabled: false
  kube-state-metrics:
    metricsTuning:
      excludeMetrics:
        - kube_configmap_.*
        - kube_secret_metadata_resource_version
        - kube_pod_init_container_.*
        - kube_pod_restart_policy
        - kube_pod_start_time
        - kube_pod_completion_time
        - kube_replicaset_created
        - kube_replicaset_metadata_generation
        - kube_replicaset_spec_replicas
        - kube_replicaset_status_.*
        - kube_daemonset_created
        - kube_daemonset_metadata_generation
        - kube_daemonset_status_observed_generation
        - kube_statefulset_created
        - kube_statefulset_persistentvolumeclaim_retention_policy
        - kube_statefulset_status_replicas$
        - kube_statefulset_status_replicas_available
        - kube_statefulset_status_replicas_current
        - kube_cronjob_created
        - kube_cronjob_info
        - kube_cronjob_metadata_resource_version
        - kube_cronjob_spec_failed_job_history_limit
        - kube_cronjob_spec_successful_job_history_limit
        - kube_job_complete
        - kube_job_created
        - kube_job_info
        - kube_job_spec_.*
        - kube_job_status_completion_time
        - kube_job_status_succeeded
  windows-exporter:
    enabled: false
    deploy: false
  node-exporter:
    enabled: true
    deploy: true
    # Intentionally BestEffort (no request/limit). node-exporter is a
    # must-run-on-every-node DaemonSet, so a memory *request* can block it from a
    # node whose allocatable is fully committed -- and it can't relocate, so that
    # node just goes dark. Hit exactly that on wk-3 (99% committed) with a 64Mi
    # request. Its ~31Mi footprint is trivial; keep it schedulable everywhere.
    metricsTuning:
      useDefaultAllowList: true
      useIntegrationAllowList: true
      includeMetrics:
        - "node_pressure.*"
        - "node_xfs.*"
        - "node_time_seconds"
        - "node_bonding.*"
      dropMetricsForFilesystem:
        - ramfs
        - tmpfs
        - nsfs
        - rootfs
        - iso9660
        - overlay
    extraArgs:
      - --collector.filesystem.fs-types-exclude=^(ramfs|tmpfs|nsfs|rootfs|iso9660|overlay)$
  kepler:
    enabled: false
  opencost:
    enabled: false

clusterEvents:
  enabled: true
  logFormat: json

# Talos has no systemd journal, so the chart's journal-based node logs
# (loki.source.journal on /var/log/journal) fail on every node -- a permanent
# unhealthy component (#662). Talos instead writes machine/service + kernel logs
# to /var/log/*.log; we collect those via loki.source.file in alloy-logs.extraConfig
# below. So disable the journal source here rather than leaving it broken.
nodeLogs:
  enabled: false

podLogs:
  enabled: true

applicationObservability:
  enabled: true
  receivers:
    otlp:
      grpc:
        enabled: true
        port: 4317
        includeMetadata: true
      http:
        enabled: true
        port: 4318
        includeMetadata: true
  processors:
    kubernetes_node:
      enabled: true
  metrics:
    enabled: true
  logs:
    enabled: true
  traces:
    enabled: false

prometheusOperatorObjects:
  enabled: true
  crds:
    deploy: false

alloy-metrics:
  enabled: true
  serviceMonitor:
    enabled: false
  extraConfig: |-
    prometheus.exporter.blackbox "blackbox_exporter" {
      config = "{ modules: { http_2xx: { prober: http, timeout: 5s } } }"
    }
  alloy:
    resources:
      requests:
        memory: 768Mi
      limits:
        memory: 1Gi

alloy-singleton:
  enabled: true
  serviceMonitor:
    enabled: false
  alloy:
    resources:
      limits:
        memory: 512Mi

alloy-logs:
  enabled: true
  serviceMonitor:
    enabled: false
  alloy:
    mounts:
      varlog: true
      dockercontainers: false
  # Collect Talos node logs from /var/log/*.log (machined, kubelet, kernel, apid,
  # controller-runtime, cri, containerd, ...) -- the machine-level logs otherwise
  # only reachable via talosctl. This container already mounts /var/log and runs
  # as root, so it can read the 0640 files. Ships to the same localLoki destination
  # as pod logs. Replaces the broken journal source (nodeLogs disabled above, #662).
  extraConfig: |-
    local.file_match "talos" {
      path_targets = [{
        __path__ = "/var/log/*.log",
        job      = "integrations/talos",
        instance = sys.env("HOSTNAME"),
      }]
    }
    loki.source.file "talos" {
      targets    = local.file_match.talos.targets
      forward_to = [loki.process.talos.receiver]
    }
    loki.process "talos" {
      // service label from the file basename: machined, kubelet, kernel, apid, ...
      stage.regex {
        source     = "filename"
        expression = "/var/log/(?P<service>[^/]+)\\.log$"
      }
      stage.labels {
        values = { service = "" }
      }
      stage.static_labels {
        values = { source = "talos" }
      }
      // Ingestion-time on purpose (no embedded-timestamp parse): tailing existing /
      // rotated content on first start would otherwise be rejected 'entry too far behind'.
      forward_to = [loki.write.localloki.receiver]
    }

alloy-receiver:
  enabled: true
  serviceMonitor:
    enabled: false
  controller:
    type: "deployment"
  alloy:
    extraPorts:
      - name: otlp-grpc
        port: 4317
        targetPort: 4317
        protocol: TCP
      - name: otlp-http
        port: 4318
        targetPort: 4318
        protocol: TCP

integrations:
  alloy:
    instances:
      - name: alloy
        namespace: alloy
        labelSelectors:
          app.kubernetes.io/name:
            - alloy-metrics
            - alloy-singleton
            - alloy-logs
            - alloy-receiver
        metrics:
          tuning:
            includeMetrics:
              - cluster_minimum_size
              - loki_source_file_.*
              - loki_source_journal_.*
              - loki_write_entry_propagation_latency_seconds.*
              - loki_write_request_size_bytes.*
              - otelcol_receiver_(accepted|refused)_(metric_points|log_records)_total
              - otelcol_exporter_sent_(metric_points|log_records|spans)_total
              - otelcol_exporter_send_failed_(metric_points|log_records|spans)_total
              - otelcol_exporter_enqueue_failed_(log_records|metric_points|spans)_total
              - otelcol_exporter_queue_.*
              - otelcol_processor_(incoming|outgoing)_items_total
              - otelcol_processor_refused_(metric_points|spans)_total
              - otelcol_processor_batch_batch_size_trigger_send_total
              - http_(client|server)_duration_milliseconds_bucket
              - rpc_(client|server)_duration_milliseconds_bucket
              - otelcol_process_cpu_seconds_total
              - otelcol_process_memory_rss_bytes
              - otelcol_process_runtime_total_alloc_bytes_total
              - otelcol_process_uptime_seconds_total
