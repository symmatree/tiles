# Static k8s-monitoring v4 values. Templated/extraObjects in alloy-application.yaml valuesObject.
#
# v4 migration (#659): named Alloy instances (alloy-metrics/-singleton/-logs/-receiver)
# became entries in the `collectors` map; supplemental services (kube-state-metrics,
# node-exporter) moved to `telemetryServices`; node-exporter scraping/tuning moved to the
# `hostMetrics` feature; `destinations` became a map (in valuesObject). Collector names are
# kept identical to the v3 instance names so the operator-created Service names
# (alloy-alloy-metrics-cluster, alloy-alloy-receiver) that extraObjects reference are preserved.

global:
  extraEnv:
    - name: SSL_CERT_FILE
      value: /etc/ssl/certs/ca-certificates.crt
  extraVolumes:
    - name: ca-certificates
      configMap:
        name: trust-bundle
  extraVolumeMounts:
    - name: ca-certificates
      mountPath: /etc/ssl/certs
      readOnly: true

# ---- Collectors (v4: replaces the v3 named-instance top-level keys) ----
collectors:
  alloy-metrics:
    presets: [clustered, statefulset]
    includeDestinations: [localMimir]
    extraConfig: |-
      prometheus.exporter.blackbox "blackbox_exporter" {
        config = "{ modules: { http_2xx: { prober: http, timeout: 5s } } }"
      }

      // etcd (#568). Talos runs etcd as a system service, not a pod, so the
      // chart's etcd integration (pod discovery) finds nothing; control-plane
      // nodes are discovered instead and scraped on the metrics port set by
      // talos-config-controlplane.yaml. The job matches the integration's name.
      discovery.kubernetes "etcd_nodes" {
        role = "node"
      }
      discovery.relabel "etcd" {
        targets = discovery.kubernetes.etcd_nodes.targets
        rule {
          source_labels = ["__meta_kubernetes_node_labelpresent_node_role_kubernetes_io_control_plane"]
          regex         = "true"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_node_address_InternalIP"]
          replacement   = "$1:2381"
          target_label  = "__address__"
        }
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          target_label  = "instance"
        }
      }
      prometheus.scrape "etcd" {
        targets    = discovery.relabel.etcd.output
        job_name   = "integrations/etcd"
        forward_to = [prometheus.relabel.etcd.receiver]
        clustering {
          enabled = true
        }
      }
      prometheus.relabel "etcd" {
        forward_to = [prometheus.remote_write.localmimir.receiver]
        // WAL fsync and backend commit latency (disk contention), and leader
        // presence and changes (the availability symptom). ~100 series for three
        // members.
        rule {
          source_labels = ["__name__"]
          regex         = "etcd_disk_wal_fsync_duration_seconds_(bucket|sum|count)|etcd_disk_backend_commit_duration_seconds_(bucket|sum|count)|etcd_server_leader_changes_seen_total|etcd_server_has_leader"
          action        = "keep"
        }
      }

      // Home Assistant's own exporter: the `prometheus:` block in ha-config's
      // configuration.yaml (namespace `ha`, requires_auth false). The appliance is
      // a LAN host rather than a workload, so there is no ServiceMonitor to
      // discover; it is a static target, addressed by the name on its certificate
      // so the handshake verifies against the trust bundle like the oauth2-proxy
      // upstream does (charts/homeassistant). Both clusters scrape it, as both run
      // the hubitat/raconteur/morpheus Probes above; the data lands in each
      // cluster's own tenant.
      prometheus.scrape "homeassistant" {
        targets = [{
          __address__ = "homeassistant.local.symmatree.com:8123",
          instance    = "homeassistant",
          job         = "integrations/homeassistant",
        }]
        scheme          = "https"
        metrics_path    = "/api/prometheus"
        scrape_interval = "60s"
        forward_to      = [prometheus.relabel.homeassistant.receiver]
        // alloy-metrics runs the clustered preset. A scrape without this block is
        // not sharded across the cluster: every replica scrapes the target and
        // Mimir receives each sample once per replica.
        clustering {
          enabled = true
        }
      }
      prometheus.relabel "homeassistant" {
        // The destination component is named from the destinations key by
        // helper.alloy_name (lowercased, - and space -> _). It adds the cluster
        // external label, so a scrape forwarded here needs none of its own.
        forward_to = [prometheus.remote_write.localmimir.receiver]
        // Measured 2026-10-27: 6,579 series per scrape, 81% of them four
        // per-entity bookkeeping families. ha_*_created is the OpenMetrics
        // counter-creation timestamp HA emits beside every counter, and
        // ha_last_updated_time_seconds repeats what the sample timestamp already
        // carries; each is one series per entity (1,328 each). The remaining two,
        // ha_entity_available and ha_state_change_total, stay: they are the
        // liveness signal (ha-config#5).
        rule {
          source_labels = ["__name__"]
          regex         = "ha_.*_created|ha_last_updated_time_seconds"
          action        = "drop"
        }
        // UniFi per-client throughput, sensor.<client>_rx/_tx plus the unnamed
        // sensor.rx_<n>/tx_<n>: 952 series of gauges that move every scrape.
        rule {
          source_labels = ["entity"]
          regex         = "sensor\\..*_(rx|tx)|sensor\\.(rx|tx)(_[0-9]+)?"
          action        = "drop"
        }
      }
    alloy:
      resources:
        requests:
          memory: 768Mi
        limits:
          memory: 1Gi

  alloy-singleton:
    presets: [singleton]
    # clusterEvents runs here and ships to Loki. The mimir.rules/mimir.alerts extraConfig
    # (in valuesObject) talks to Mimir directly via its own address, not a destination.
    includeDestinations: [localLoki]
    alloy:
      # mimir.alerts.kubernetes is an experimental Alloy component. v4 validates at
      # template time that the collector's stability level covers its components, so this
      # is required for the render (and the runtime) to accept the extraConfig -- the #658
      # CrashLoop class of failure is now caught before deploy.
      stabilityLevel: experimental
      resources:
        limits:
          memory: 512Mi

  alloy-logs:
    presets: [filesystem-log-reader, daemonset]
    includeDestinations: [localLoki]
    alloy:
      mounts:
        # The filesystem-log-reader preset also mounts /var/lib/docker/containers; Talos
        # doesn't use it, so turn it back off (v3 alloy-logs.alloy.mounts.dockercontainers).
        dockercontainers: false
    # Collect Talos node logs from /var/log/*.log (machined, kubelet, kernel, apid,
    # controller-runtime, cri, containerd, ...) -- the machine-level logs otherwise only
    # reachable via talosctl. This container mounts /var/log (varlog preset) and runs as
    # root, so it can read the 0640 files. Ships to the same localLoki destination as pod
    # logs. Replaces the broken journal source (nodeLogs disabled below, #662).
    extraConfig: |-
      local.file_match "talos" {
        path_targets = [{
          __path__ = "/var/log/*.log",
          job      = "integrations/talos",
          instance = sys.env("HOSTNAME"),
        }]
      }
      loki.source.file "talos" {
        targets    = local.file_match.talos.targets
        forward_to = [loki.process.talos.receiver]
      }
      loki.process "talos" {
        // service label from the file basename: machined, kubelet, kernel, apid, ...
        stage.regex {
          source     = "filename"
          expression = "/var/log/(?P<service>[^/]+)\\.log$"
        }
        stage.labels {
          values = { service = "" }
        }
        stage.static_labels {
          values = { source = "talos" }
        }
        // Drop lancer's WMI-mapper ACPI spam: its AMD firmware fires a PNP0C14 WMI notify
        // every ~5s that no kernel driver claims, so Talos logs each as an 'ignoring ACPI
        // event' warning (~17k lines/day, lancer-only, dead-flat -- benign firmware polling,
        // not a fault). Scoped to the "wmi payload so a genuine ACPI event (thermal, button,
        // different payload) still comes through.
        stage.drop {
          expression          = "ignoring ACPI event: \"wmi"
          drop_counter_reason = "talos_wmi_acpi_noise"
        }
        // Ingestion-time on purpose (no embedded-timestamp parse): tailing existing /
        // rotated content on first start would otherwise be rejected 'entry too far behind'.
        forward_to = [loki.write.localloki.receiver]
      }

  alloy-receiver:
    # otel-receiver opens the standard OTLP ports (4317 gRPC / 4318 HTTP) on the Service;
    # deployment runs it as a single Deployment (v3 alloy-receiver.controller.type).
    presets: [otel-receiver, deployment]
    includeDestinations: [localMimir, localLoki]

# ---- Features (v4: each enabled feature must name its collector) ----
clusterMetrics:
  enabled: true
  collector: alloy-metrics
  controlPlane:
    enabled: true
  apiServer:
    metricsTuning:
      # includeMetrics is the whole allowlist here (no useDefaultAllowList), so
      # nothing arrives that is not named below. Keep it to single-series gauges:
      # the apiserver's own histograms (apiserver_request_duration_seconds,
      # watch/storage latency) are per-resource-per-verb and are what would blow
      # up the scrape.
      includeMetrics:
        - apiserver_request_total
        - apiserver_request_sli_duration_seconds.*
        - apiserver_client_certificate_expiration_seconds.*
        - apiserver_request_terminations_total
        - aggregator_unavailable_apiservice.*
        - rest_client_requests_total
        - kubernetes_build_info
        # Which resource kinds are watched on which apiserver. Watch clients are
        # not distributed evenly: KubePrism prefers the lowest-latency endpoint,
        # which on a control-plane node is its own apiserver, so a node's watchers
        # concentrate there and its apiserver's watch cache grows to match. This
        # gauge is per group/version/kind, so it names the resource rather than the
        # client, and the owning controller has to be inferred from the kind.
        # Bounded by the number of API resource kinds -- 113 in this cluster, so at
        # most ~113 series per control-plane node, and fewer in practice because
        # only kinds with a live watcher emit. Bears on the sizing question in #768.
        - apiserver_registered_watchers
        # Apiserver process memory. One series per control-plane node each.
        # RSS is what the node pays for; heap_inuse is what is live, so the
        # difference is memory the Go runtime is holding and has not returned --
        # which on an unlimited static pod only comes back under node pressure.
        # Sizing the control-plane VMs (#768) turns on that split.
        - process_resident_memory_bytes
        - go_memstats_heap_inuse_bytes
  kubeProxy:
    enabled: false
  kube-state-metrics:
    metricsTuning:
      excludeMetrics:
        - kube_configmap_.*
        - kube_secret_metadata_resource_version
        - kube_pod_init_container_.*
        - kube_pod_restart_policy
        - kube_pod_start_time
        - kube_pod_completion_time
        - kube_replicaset_created
        - kube_replicaset_metadata_generation
        - kube_replicaset_spec_replicas
        - kube_replicaset_status_.*
        - kube_daemonset_created
        - kube_daemonset_metadata_generation
        - kube_daemonset_status_observed_generation
        - kube_statefulset_created
        - kube_statefulset_persistentvolumeclaim_retention_policy
        - kube_statefulset_status_replicas$
        - kube_statefulset_status_replicas_available
        - kube_statefulset_status_replicas_current
        - kube_cronjob_created
        - kube_cronjob_info
        - kube_cronjob_metadata_resource_version
        - kube_cronjob_spec_failed_job_history_limit
        - kube_cronjob_spec_successful_job_history_limit
        - kube_job_complete
        - kube_job_created
        - kube_job_info
        - kube_job_spec_.*
        - kube_job_status_completion_time
        - kube_job_status_succeeded

# node-exporter host metrics (v3: clusterMetrics.node-exporter). The DaemonSet itself is
# deployed under telemetryServices below; this feature scrapes + tunes it. source defaults
# to "node-exporter", which auto-discovers the telemetryServices deployment.
hostMetrics:
  enabled: true
  collector: alloy-metrics
  linuxHosts:
    enabled: true
    metricsTuning:
      useDefaultAllowList: true
      useIntegrationAllowList: true
      includeMetrics:
        - "node_pressure.*"
        - "node_xfs.*"
        - "node_time_seconds"
        - "node_bonding.*"
        # Bare-metal hardware health (#580): the metal nodes (lancer, acebase) already
        # load their sensor modules (k10temp+amdgpu / coretemp+drivetemp) and node-exporter's
        # hwmon collector emits temps, but the default+integration allowlists drop node_hwmon_*,
        # so no metal temperatures reach Mimir. Keep the hwmon family (temps + their max/crit
        # thresholds + alarm flags + power/voltage), the cooling-device state (thermal-throttle
        # response) and the ACPI thermal zone. Low cardinality: VMs emit none of these; edge
        # hosts (raconteur/proxmox) ship temps via the OTLP path, not this allowlist.
        - "node_hwmon_.*"
        - "node_cooling_device_.*"
        - "node_thermal_zone_.*"
      dropMetricsForFilesystem:
        - ramfs
        - tmpfs
        - nsfs
        - rootfs
        - iso9660
        - overlay

clusterEvents:
  enabled: true
  collector: alloy-singleton
  logFormat: json

# Talos has no systemd journal, so the chart's journal-based node logs fail on every node
# (#662). Talos writes machine/service + kernel logs to /var/log/*.log; we collect those via
# the alloy-logs collector's extraConfig above. So disable the journal source here.
nodeLogs:
  enabled: false

podLogsViaLoki:
  enabled: true
  collector: alloy-logs
  # Read each pod log file from the start, not from its end. This sets
  # `tail_from_end` on `loki.source.file "pod_logs"`; the chart default is true.
  #
  # Pod discovery is a watch and so is immediate, but collection tails files under
  # /var/log/pods and `local.file_match` polls the filesystem (10s default). With
  # tail_from_end, Alloy seeks to EOF when it finally opens a file, so anything the
  # pod wrote before that seek is never read and there is no catch-up. A pod that
  # writes its output in the first second or two and exits is collected as nothing.
  #
  # Measured 2026-10-17: two pods in one namespace with the same marker, one writing
  # at t+25s and persisting, one writing at t+0s and exiting at ~t+1s. The long one
  # reached Loki, the short one did not, while both stayed readable with
  # `kubectl logs`. That covers every Argo Workflow step pod (fleet-control's
  # converge steps run ~15s), every CronJob pod that finishes quickly, and every
  # ephemeral debug pod -- so an absence of logs in Loki for a short-lived pod was
  # not evidence of anything.
  #
  # Cost of false: on a fresh position file the collector re-reads existing files
  # from the start instead of from EOF. Positions are tracked in collector state, so
  # that is a one-off rather than per restart.
  onlyGatherNewLogLines: false

applicationObservability:
  enabled: true
  collector: alloy-receiver
  # Node/pod k8s enrichment is on by default in v4 (resourceDetection + k8sattributes
  # processors), replacing the v3 processors.kubernetes_node toggle.
  receivers:
    otlp:
      grpc:
        enabled: true
        port: 4317
        includeMetadata: true
      http:
        enabled: true
        port: 4318
        includeMetadata: true
  metrics:
    enabled: true
  logs:
    enabled: true
  traces:
    enabled: false

prometheusOperatorObjects:
  enabled: true
  collector: alloy-metrics
  crds:
    deploy: false

integrations:
  collector: alloy-metrics
  alloy:
    instances:
      - name: alloy
        namespace: alloy
        labelSelectors:
          app.kubernetes.io/name:
            - alloy-metrics
            - alloy-singleton
            - alloy-logs
            - alloy-receiver
        metrics:
          tuning:
            includeMetrics:
              - cluster_minimum_size
              - loki_source_file_.*
              - loki_source_journal_.*
              - loki_write_entry_propagation_latency_seconds.*
              - loki_write_request_size_bytes.*
              - otelcol_receiver_(accepted|refused)_(metric_points|log_records)_total
              - otelcol_exporter_sent_(metric_points|log_records|spans)_total
              - otelcol_exporter_send_failed_(metric_points|log_records|spans)_total
              - otelcol_exporter_enqueue_failed_(log_records|metric_points|spans)_total
              - otelcol_exporter_queue_.*
              - otelcol_processor_(incoming|outgoing)_items_total
              - otelcol_processor_refused_(metric_points|spans)_total
              - otelcol_processor_batch_batch_size_trigger_send_total
              - http_(client|server)_duration_milliseconds_bucket
              - rpc_(client|server)_duration_milliseconds_bucket
              - otelcol_process_cpu_seconds_total
              - otelcol_process_memory_rss_bytes
              - otelcol_process_runtime_total_alloc_bytes_total
              - otelcol_process_uptime_seconds_total

# ---- Telemetry services (v4: supplemental deployments, explicit) ----
telemetryServices:
  kube-state-metrics:
    deploy: true
  node-exporter:
    deploy: true
    # Intentionally BestEffort (no request/limit). node-exporter is a must-run-on-every-node
    # DaemonSet, so a memory *request* can block it from a node whose allocatable is fully
    # committed -- and it can't relocate, so that node just goes dark. Hit exactly that on
    # wk-3 (99% committed) with a 64Mi request. Its ~31Mi footprint is trivial; keep it
    # schedulable everywhere.
    resources: {}
    extraArgs:
      - --collector.filesystem.fs-types-exclude=^(ramfs|tmpfs|nsfs|rootfs|iso9660|overlay)$
  windows-exporter:
    deploy: false
