# Resource overrides for tiles (prod). Same as pre-split monolithic valuesObject; tune here when raising prod requests/limits.

ingester:
  resources:
    requests:
      memory: 300Mi
kafka:
  resources:
    requests:
      memory: 256Mi

store_gateway:
  zoneAwareReplication:
    enabled: false
  resources:
    requests:
      memory: 1Gi

alertmanager:
  # 3-day peak working-set ~78Mi (Mimir). (The alert-forward sidecar, ~88Mi, is
  # a separate container and is left unbounded for now.)
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 256Mi
