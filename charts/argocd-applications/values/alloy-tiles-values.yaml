# Resource overrides for tiles (prod). Tune from observed usage plus headroom.
# v4: resources live under the `collectors` map (was top-level named instances in v3).
# Deep-merged over the base collector definitions in alloy-values.yaml.

collectors:
  alloy-logs:
    alloy:
      resources:
        requests:
          memory: 128Mi
        limits:
          memory: 384Mi

  alloy-receiver:
    alloy:
      resources:
        requests:
          memory: 128Mi
        limits:
          memory: 256Mi

  alloy-singleton:
    alloy:
      resources:
        requests:
          memory: 128Mi
        limits:
          memory: 256Mi

# Neither had a memory request, and both are on wk-2.
# Sizing rule: see grafana-tiles-values.yaml.
#
# alloy-operator     p85 111  p99 118
alloy-operator:
  resources:
    requests:
      memory: 112Mi
telemetryServices:
  # kube-state-metrics p85 62  p99 71
  kube-state-metrics:
    resources:
      requests:
        memory: 64Mi
