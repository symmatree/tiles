# Resource overrides for tiles (prod). Tune from observed usage plus headroom.
# v4: resources live under the `collectors` map (was top-level named instances in v3).
# Deep-merged over the base collector definitions in alloy-values.yaml.

collectors:
  alloy-logs:
    alloy:
      resources:
        requests:
          memory: 128Mi
        limits:
          memory: 384Mi

  alloy-receiver:
    alloy:
      resources:
        requests:
          memory: 128Mi
        limits:
          memory: 256Mi

  alloy-singleton:
    alloy:
      resources:
        requests:
          memory: 128Mi
        limits:
          memory: 256Mi

# Neither had a memory request, and both are on wk-2. Sized from the prod 30-day
# max working set (Mimir), which agrees with the 7-day figure for both.
alloy-operator:
  # 118Mi
  resources:
    requests:
      memory: 160Mi
telemetryServices:
  kube-state-metrics:
    # 82Mi
    resources:
      requests:
        memory: 128Mi
