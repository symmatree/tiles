# Per-cluster overrides for tiles.
cilium:
  ingressController:
    service:
      # Pin the shared ingress (the WAN-forwarded front door) to a static IP:
      # opt into lb-static-pool (label) and request the IP (lbipam annotation).
      # See charts/cilium-config/templates/lb-static-pool.helm.yaml. The IP MUST
      # equal tf/nodes/prod.tfvars ingress_lb_ip (which the UniFi port-forward
      # targets) and fall inside that pool's /24 -- keep them in sync.
      labels:
        tiles.symmatree.com/static-lb: "true"
      annotations:
        lbipam.cilium.io/ips: "10.0.130.1"

  # These three had no memory request. All carry a control-plane nodeSelector
  # (#768), so with no cost attached the scheduler stacked every one of them on
  # cp-2. Sizing rule: see grafana-tiles-values.yaml.
  #
  # cilium-operator  p85 102  p99 133
  operator:
    resources:
      requests:
        memory: 104Mi
  hubble:
    relay:
      # p85 77  p99 77
      resources:
        requests:
          memory: 80Mi
    ui:
      backend:
        # p85 46  p99 49
        resources:
          requests:
            memory: 48Mi
      frontend:
        # p85 5  p99 5
        resources:
          requests:
            memory: 8Mi
