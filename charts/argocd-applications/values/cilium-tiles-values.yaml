# Per-cluster overrides for tiles.
cilium:
  ingressController:
    service:
      # Pin the shared ingress (the WAN-forwarded front door) to a static IP:
      # opt into lb-static-pool (label) and request the IP (lbipam annotation).
      # See charts/cilium-config/templates/lb-static-pool.helm.yaml. The IP MUST
      # equal tf/nodes/prod.tfvars ingress_lb_ip (which the UniFi port-forward
      # targets) and fall inside that pool's /24 -- keep them in sync.
      labels:
        tiles.symmatree.com/static-lb: "true"
      annotations:
        lbipam.cilium.io/ips: "10.0.130.1"

# Measured on prod (talosctl cgroups): cilium-operator 66Mi peak on cp-1,
# hubble-relay 55Mi peak and the hubble-ui pod 83Mi peak on cp-2. All three
# carry a control-plane nodeSelector (#768) and had no request, so cp-2 has
# accumulated every one of them.
  operator:
    resources:
      requests:
        memory: 128Mi
  hubble:
    relay:
      resources:
        requests:
          memory: 128Mi
    ui:
      backend:
        resources:
          requests:
            memory: 128Mi
      frontend:
        resources:
          requests:
            memory: 32Mi
