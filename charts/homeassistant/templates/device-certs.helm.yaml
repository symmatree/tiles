{{- $dc := .Values.deviceCerts }}
{{- if $dc.names }}
# Keystore password for every device certificate below. It protects the PKCS#12
# on its way to the device and nothing afterwards -- Android re-wraps the key
# into its own credential storage on import -- so one item covers all of them.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ $dc.onePasswordItem }}
  namespace: "{{ $.Release.Namespace }}"
type: Opaque
spec:
  itemPath: 'vaults/{{ required ".Values.vault_name is required" $.Values.vault_name }}/items/{{ $dc.onePasswordItem }}'
{{- range $dc.names }}
---
# Client certificate for {{ . }}. The CN is what ghostunnel matches with
# --allow-cn, so this name and the ghostunnel.allowedCNs entry are the same
# string by construction.
#
# usages omits server auth deliberately: this credential can only ever
# authenticate a client, so a leaked key cannot be used to stand up something
# that impersonates a service.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: device-{{ . }}
  namespace: "{{ $.Release.Namespace }}"
spec:
  commonName: {{ . | quote }}
  secretName: device-{{ . }}-tls
  duration: {{ $dc.duration }}
  renewBefore: {{ $dc.renewBefore }}
  usages:
    - digital signature
    - key encipherment
    - client auth
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  keystores:
    pkcs12:
      create: true
      passwordSecretRef:
        name: {{ $dc.onePasswordItem }}
        key: password
  issuerRef:
    name: "{{ $.Values.cluster_name }}-device-ca-issuer"
    kind: ClusterIssuer
    group: cert-manager.io
{{- end }}
{{- end }}
