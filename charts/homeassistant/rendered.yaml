---
# Source: homeassistant/templates/ghostunnel.helm.yaml
# Server certificate the phone verifies. An ordinary Let's Encrypt certificate,
# so no custom root has to be installed on any device -- the device CA is used
# only in the other direction, to authenticate the client.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homeassistant-device-tls
  namespace: "homeassistant"
spec:
  dnsNames:
    - "homeassistant-device.placeholder.symmatree.com"
  secretName: homeassistant-device-tls
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: real-cert
    kind: ClusterIssuer
    group: cert-manager.io
---
# Source: homeassistant/templates/device-certs.helm.yaml
# Keystore password for every device certificate below. It protects the PKCS#12
# on its way to the device and nothing afterwards -- Android re-wraps the key
# into its own credential storage on import -- so one item covers all of them.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: device-cert-password
  namespace: "homeassistant"
type: Opaque
spec:
  itemPath: 'vaults/placeholder/items/device-cert-password'
