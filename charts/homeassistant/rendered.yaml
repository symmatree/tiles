# Source: homeassistant/charts/oauth2-proxy/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  labels:
    app: oauth2-proxy    
    helm.sh/chart: oauth2-proxy-7.7.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: authentication-proxy
    app.kubernetes.io/part-of: oauth2-proxy
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/instance: homeassistant
    app.kubernetes.io/version: "7.6.0"
  name: homeassistant-oauth2-proxy
  namespace: homeassistant
  annotations:
    cert-manager.io/cluster-issuer: real-cert
    external-dns.alpha.kubernetes.io/target: lhitw.symmatree.com
    ingress.cilium.io/loadbalancer-mode: shared
spec:
  ingressClassName: "cilium"
  rules:
    - host: "homeassistant.placeholder.symmatree.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homeassistant-oauth2-proxy
                port:
                  number: 80
  tls:
    - hosts:
      - homeassistant.placeholder.symmatree.com
      secretName: homeassistant-oauth2-proxy-tls
