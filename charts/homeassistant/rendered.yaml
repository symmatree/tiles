# Source: homeassistant/templates/device-certs.helm.yaml
# Client certificate for seth-pixel. The CN is what ghostunnel matches with
# --allow-cn, so this name and the ghostunnel.allowedCNs entry are the same
# string by construction.
#
# usages omits server auth deliberately: this credential can only ever
# authenticate a client, so a leaked key cannot be used to stand up something
# that impersonates a service.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: device-seth-pixel
  namespace: "homeassistant"
spec:
  commonName: "seth-pixel"
  secretName: device-seth-pixel-tls
  duration: 17520h
  renewBefore: 2160h
  usages:
    - digital signature
    - key encipherment
    - client auth
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  keystores:
    pkcs12:
      create: true
      passwordSecretRef:
        name: device-cert-password
        key: password
  issuerRef:
    name: "placeholder-device-ca-issuer"
    kind: ClusterIssuer
    group: cert-manager.io
---
