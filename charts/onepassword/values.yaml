# https://raw.githubusercontent.com/1Password/connect-helm-charts/refs/tags/connect-1.17.0/charts/connect/values.yaml
# with values removed unless overriding.

connect:
  # This section of values is for 1Password Connect API and Sync Configuration
  connect:
    # The 1Password Connect API Specific Values
    # Sizing rule: charts/cert-manager/values.yaml. 14-day p85 (Mimir).
    api:
      # No memory request declared here on purpose. The chart sets
      # limits.memory 128Mi and no memory request, so Kubernetes defaults the
      # request to the limit -- the live pod requests 128Mi. Declaring the p85
      # (36Mi) would therefore *lower* the effective request and rank this
      # container earlier for eviction, which is the same trade rejected for the
      # cert-manager webhook. Left alone.
      serviceMonitor:
        enabled: true
    sync:
      # p85 18  p99 24  max 29
      resources:
        requests:
          memory: 24Mi
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
    nodeSelector:
      kubernetes.io/os: linux
      node-role.kubernetes.io/control-plane: ""
    ingress:
      # Until we have a use case, reduce surface area.
      enabled: false
  operator:
    # Denotes whether the 1Password Operator will be deployed
    create: true
    # p85 85  p99 85
    resources:
      requests:
        memory: 88Mi
    # Useful to have it run even when the workers are shut down.
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
    nodeSelector:
      kubernetes.io/os: linux
      node-role.kubernetes.io/control-plane: ""
