apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: onepassword
spec:
  project: '{{ required ".Values.cluster_name is required" .Values.cluster_name }}'
  source:
    repoURL: https://github.com/symmatree/tiles.git
    targetRevision: '{{ required ".Values.targetRevision is required" .Values.targetRevision }}'
    path: charts/onepassword
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: onepassword
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # No CreateNamespace/managedNamespaceMetadata: Terraform owns the
      # onepassword namespace (tf/nodes/k8s-bootstrap.tf), because it has to
      # exist before Terraform creates the operator secrets in it, which happens
      # before Argo CD exists at all. Leaving both writers on it is the dual
      # ownership we are trying to avoid.
      - ServerSideApply=true
