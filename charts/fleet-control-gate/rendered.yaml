---
# Source: fleet-control-gate/charts/oauth2-proxy/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: oauth2-proxy    
    helm.sh/chart: oauth2-proxy-7.7.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: authentication-proxy
    app.kubernetes.io/part-of: oauth2-proxy
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/instance: fleet-control-gate
    app.kubernetes.io/version: "7.6.0"
  name: fleet-control-gate-oauth2-proxy
  namespace: fleet-control-gate
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:      
      app.kubernetes.io/name: oauth2-proxy
      app.kubernetes.io/instance: fleet-control-gate
  template:
    metadata:
      annotations:
        checksum/config: 9c1ecd9f0889c5271728298190b5b9b1104baac2492387267c860173bb7765e8
        checksum/config-emails: 15454f5309ca0f15d5a2d0cf6dd7f6d84599d7e8e349612bb4b64c7579591502
        checksum/secret: 8fa6fdae65861caa2986544b8860a5205be1937328c8ec2bad6bad076b9e2425
        checksum/google-secret: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
        checksum/redis-secret: 01ba4719c80b6fe911b091a7c05124b64eeece964e09c058ef8f9805daca546b
      labels:
        app: oauth2-proxy        
        helm.sh/chart: oauth2-proxy-7.7.0
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: authentication-proxy
        app.kubernetes.io/part-of: oauth2-proxy
        app.kubernetes.io/name: oauth2-proxy
        app.kubernetes.io/instance: fleet-control-gate
        app.kubernetes.io/version: "7.6.0"
    spec:
      serviceAccountName: fleet-control-gate-oauth2-proxy
      automountServiceAccountToken: true
      containers:
      - name: oauth2-proxy
        image: "quay.io/oauth2-proxy/oauth2-proxy:v7.15.3"
        imagePullPolicy: IfNotPresent
        args:
          - --http-address=0.0.0.0:4180
          - --https-address=0.0.0.0:4443
          - --metrics-address=0.0.0.0:44180
          - --provider=google
          - --upstream=http://fleet-control:8080
          - --pass-host-header=true
          - --set-xauthrequest=true
          - --silence-ping-logging=true
          - --skip-provider-button=true
          - --reverse-proxy=true
          - --trusted-proxy-ip=10.0.144.0/20
          - --config=/etc/oauth2_proxy/oauth2_proxy.cfg
          - --authenticated-emails-file=/etc/oauth2-proxy/fleet-control-gate-oauth2-proxy-accesslist
        env:
        - name: OAUTH2_PROXY_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name:  fleet-control-oauth2-proxy
              key: client-id
        - name: OAUTH2_PROXY_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name:  fleet-control-oauth2-proxy
              key: client-secret
        - name: OAUTH2_PROXY_COOKIE_SECRET
          valueFrom:
            secretKeyRef:
              name:  fleet-control-oauth2-proxy
              key: cookie-secret
        ports:
          - containerPort: 4180
            name: http
            protocol: TCP
          - containerPort: 44180
            protocol: TCP
            name: metrics
        livenessProbe:
          httpGet:
            path: /ping
            port: http
            scheme: HTTP
          initialDelaySeconds: 0
          timeoutSeconds: 1
        readinessProbe:
          httpGet:
            path: /ready
            port: http
            scheme: HTTP
          initialDelaySeconds: 0
          timeoutSeconds: 5
          successThreshold: 1
          periodSeconds: 10
        resources:
          {}
        volumeMounts:
        - mountPath: /etc/oauth2_proxy/oauth2_proxy.cfg
          name: configmain
          subPath: oauth2_proxy.cfg
        - mountPath: /etc/oauth2-proxy
          name: configaccesslist
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 2000
          runAsNonRoot: true
          runAsUser: 2000
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - configMap:
          defaultMode: 420
          name: fleet-control-gate-oauth2-proxy
        name: configmain
      - configMap:
          name: fleet-control-gate-oauth2-proxy-accesslist
          items:
          - key: restricted_user_access
            path: fleet-control-gate-oauth2-proxy-accesslist
        name: configaccesslist
      tolerations:
        []

---
# Source: fleet-control-gate/charts/oauth2-proxy/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  labels:
    app: oauth2-proxy    
    helm.sh/chart: oauth2-proxy-7.7.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: authentication-proxy
    app.kubernetes.io/part-of: oauth2-proxy
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/instance: fleet-control-gate
    app.kubernetes.io/version: "7.6.0"
  name: fleet-control-gate-oauth2-proxy
  namespace: fleet-control-gate
  annotations:
    cert-manager.io/cluster-issuer: real-cert
    external-dns.alpha.kubernetes.io/target: lhitw.symmatree.com
    ingress.cilium.io/loadbalancer-mode: shared
spec:
  ingressClassName: "cilium"
  rules:
    - host: "fleet-remote.placeholder.symmatree.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fleet-control-gate-oauth2-proxy
                port:
                  number: 80
  tls:
    - hosts:
      - fleet-remote.placeholder.symmatree.com
      secretName: fleet-control-oauth2-proxy-tls
---
# Source: fleet-control-gate/templates/oauth2-proxy-secret.yaml
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: fleet-control-oauth2-proxy
  namespace: "fleet-control-gate"
type: Opaque
spec:
  itemPath: 'vaults/placeholder/items/fleet-control-oauth2-proxy'
