# Device-identity CA: a trust root used ONLY to authenticate machines that must
# prove who they are to us and cannot run an OAuth/OIDC flow -- phones presenting
# a client certificate to a TLS terminator, and later any rover or base station
# with the same problem. It is named for the capability, not for its first
# consumer, so a second consumer does not need a second CA.
#
# Deliberately separate from {cluster_name}-ca-issuer, for two reasons:
#
#   1. Lifetime. Device certificates are installed by hand on hardware we may not
#      be holding, so they are issued long. A CA that rotates underneath them
#      invalidates every one of them at once, which is the failure this chain
#      exists to avoid.
#   2. Position. This CA is only ever loaded as a verifier of *client*
#      certificates. It must never appear in a RootCAs position, so it is NOT a
#      source in templates/ca-bundle.yaml and must not be added to one -- that
#      would make it trusted to vouch for servers as well.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: "{{ .Values.cluster_name }}-device-selfsigned-root"
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "{{ .Values.cluster_name }}-device-ca"
  namespace: cert-manager
spec:
  isCA: true
  commonName: "{{ .Values.cluster_name }} device identity"
  subject:
    organizations:
      - "{{ .Values.cluster_name }}"
    organizationalUnits:
      - device-identity
  # Two years. cert-manager's default is 90 days, which is what
  # {cluster_name}-ca is running on today -- fine for in-cluster leaf certs that
  # renew themselves, wrong for a root whose leaves are installed by hand.
  duration: 17520h
  renewBefore: 2160h
  privateKey:
    algorithm: ECDSA
    size: 256
    # Renewal must re-sign with the SAME key. The replacement certificate then
    # carries the same subject and public key, so device certificates already
    # issued continue to chain to it. With Always, every issued device
    # certificate would stop verifying the moment this renews.
    rotationPolicy: Never
  secretName: "{{ .Values.cluster_name }}-device-ca-tls"
  issuerRef:
    name: "{{ .Values.cluster_name }}-device-selfsigned-root"
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: "{{ .Values.cluster_name }}-device-ca-issuer"
spec:
  ca:
    secretName: "{{ .Values.cluster_name }}-device-ca-tls"
