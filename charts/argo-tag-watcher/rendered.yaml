---
# Source: argo-tag-watcher/templates/rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-tag-watcher
  namespace: "argo-tag-watcher"
---
# Source: argo-tag-watcher/templates/rbac.yaml
# The image side reaches outside the argocd namespace: opted-in workloads live in
# their own namespaces, so finding them means listing cluster-wide. It reads pods
# to learn which digest each one actually pulled, and patches the workload's pod
# template to roll it -- it cannot create, delete or scale anything.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argo-tag-watcher
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["list", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
# Source: argo-tag-watcher/templates/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argo-tag-watcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argo-tag-watcher
subjects:
  - kind: ServiceAccount
    name: argo-tag-watcher
    namespace: "argo-tag-watcher"

---
# Source: argo-tag-watcher/templates/rbac.yaml
# The git side: only read Applications and set the refresh annotation.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-tag-watcher
  namespace: "argo-tag-watcher"
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["list", "patch"]
---
# Source: argo-tag-watcher/templates/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-tag-watcher
  namespace: "argo-tag-watcher"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-tag-watcher
subjects:
  - kind: ServiceAccount
    name: argo-tag-watcher
    namespace: "argo-tag-watcher"
---
# Source: argo-tag-watcher/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argo-tag-watcher
  namespace: "argo-tag-watcher"
  labels:
    app.kubernetes.io/name: argo-tag-watcher
  annotations:
    # Watches itself. Its own image is a floating tag, so it has the problem it
    # exists to solve: if the image build finishes after Argo has already rolled
    # this Deployment, the pod sits on the previous digest and nothing else here
    # would notice. Restarting itself mid-check is safe -- the comparison holds no
    # state, so the next process start just redoes the pass.
    tiles.symmatree.com/roll-on-digest-change: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: argo-tag-watcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argo-tag-watcher
    spec:
      serviceAccountName: argo-tag-watcher
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: argo-tag-watcher
          image: "ghcr.io/symmatree/tiles/argo-tag-watcher:main"
          # The image tag floats, so the digest moves without the tag changing.
          # Without this the kubelet reuses whatever :main it already cached and a
          # rolled pod comes back on the old binary -- the precondition this
          # watcher requires of anything it watches, which it has to meet itself.
          imagePullPolicy: Always
          env:
            - name: REPO_URL
              value: "https://github.com/symmatree/tiles.git"
            # The tag we deploy from is the tag we watch.
            - name: WATCH_REF
              value: 'placeholder'
            - name: ARGOCD_NAMESPACE
              value: "argo-tag-watcher"
            - name: INTERVAL
              value: "60s"
            - name: BATCH_SIZE
              value: "4"
            - name: BATCH_DELAY
              value: "5s"
            - name: IMAGE_INTERVAL
              value: "5m"
            - name: HOME # git wants a writable HOME even for ls-remote
              value: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
