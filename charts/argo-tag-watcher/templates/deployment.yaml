apiVersion: apps/v1
kind: Deployment
metadata:
  name: argo-tag-watcher
  namespace: "{{ .Release.Namespace }}"
  labels:
    app.kubernetes.io/name: argo-tag-watcher
  annotations:
    # Watches itself. Its own image is a floating tag, so it has the problem it
    # exists to solve: if the image build finishes after Argo has already rolled
    # this Deployment, the pod sits on the previous digest and nothing else here
    # would notice. Restarting itself mid-check is safe -- the comparison holds no
    # state, so the next process start just redoes the pass.
    tiles.symmatree.com/roll-on-digest-change: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: argo-tag-watcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argo-tag-watcher
    spec:
      serviceAccountName: argo-tag-watcher
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: argo-tag-watcher
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          # The image tag floats, so the digest moves without the tag changing.
          # Without this the kubelet reuses whatever :main it already cached and a
          # rolled pod comes back on the old binary -- the precondition this
          # watcher requires of anything it watches, which it has to meet itself.
          imagePullPolicy: Always
          env:
            - name: REPO_URL
              value: "{{ .Values.repoURL }}"
            # The tag we deploy from is the tag we watch.
            - name: WATCH_REF
              value: '{{ required ".Values.targetRevision is required" .Values.targetRevision }}'
            - name: ARGOCD_NAMESPACE
              value: "{{ .Release.Namespace }}"
            - name: INTERVAL
              value: "{{ .Values.interval }}"
            - name: BATCH_SIZE
              value: "{{ .Values.batchSize }}"
            - name: BATCH_DELAY
              value: "{{ .Values.batchDelay }}"
            - name: IMAGE_INTERVAL
              value: "{{ .Values.imageInterval }}"
            - name: HOME # git wants a writable HOME even for ls-remote
              value: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
