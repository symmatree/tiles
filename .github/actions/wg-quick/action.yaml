name: 'wg-quick'
description: 'Connect to a Wireguard VPN'
inputs:
  wg_config:
    description: 'Wireguard config'
    required: true
outputs:
  wg_connected:
    description: 'Whether the Wireguard VPN is connected'
    value: ${{ steps.wireguard.outputs.wg_connected }}
runs:
  using: "composite"
  steps:
      - name: WG Quick
        id: wireguard
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ inputs.wg_config }}" ]; then
            echo "No Wireguard config provided"
            exit 1
          fi
          echo "Setting up Wireguard..."
          time sudo apt-get -y \
           -qq -o Dpkg::Progress-Fancy="0" -o APT::Color="0" -o Dpkg::Use-Pty="0" \
            install wireguard-tools
          # Under /etc/wireguard: on ubuntu-26.04 (wireguard-tools 1.0.20250521) wg-quick
          # cannot read a config in $HOME, even as root ("Permission denied").
          sudo install -d -m 0700 /etc/wireguard
          echo "${{ inputs.wg_config }}" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 0600 /etc/wireguard/wg0.conf

          echo "=== Config file contents (base64 encoded, keys removed) ==="
          sudo grep -v -E "^(PrivateKey|PublicKey)\s*=" /etc/wireguard/wg0.conf | base64 | base64

          echo "Connecting..."
          time sudo wg-quick up wg0
          echo "Connected"
          echo "wg_connected=1" | tee -a "$GITHUB_OUTPUT"
