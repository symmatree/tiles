name: publish-crd-charts
run-name: "Publish CRD charts from ${{ github.ref_name }} by @${{ github.actor }}"
on:
  workflow_dispatch: {}
  # A pull request builds and lints the charts and pushes nothing.
  pull_request:
    paths:
      - ci-tools/crd-charts/**
      - .github/workflows/publish-crd-charts.yaml
  # On main, nodes-plan-apply calls this before its apply, so the charts it
  # installs are the ones just built from main.
  workflow_call: {}

# Charts are published only from main, as the floating version
# 0.0.0-branch-main (ci-tools/crd-charts/build.py). tf/nodes/k8s-bootstrap.tf
# pins that version and upgrades a release when its sources.yaml entry changes.
jobs:
  publish-crd-charts:
    name: publish-crd-charts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      CHART_REGISTRY: oci://ghcr.io/${{ github.repository }}/charts
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: "v4.3.2"

      - name: Build charts from upstream CRD YAML
        run: ./ci-tools/crd-charts/build.py

      - name: Lint and package
        run: |
          set -euo pipefail
          mkdir -p build/packages
          for chart in build/crd-charts/*/; do
            helm lint "${chart}"
            helm package "${chart}" -d build/packages
          done
          ls -l build/packages

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin <<<"${{ github.token }}"

      - name: Push charts
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          for package in build/packages/*.tgz; do
            helm push "${package}" "${CHART_REGISTRY}"
          done
