name: build-host-maintenance
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - containers/host-maintenance/**
      - .github/workflows/build-host-maintenance.yaml
  schedule:
    - cron: 0 9 * * *
jobs:
  build-host-maintenance:
    permissions:
      contents: read
      id-token: write
      packages: write
    name: build-host-maintenance
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/symmatree/tiles/host-maintenance
      IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
      REGISTRY_USER: ${{ github.actor }}
      REGISTRY_PASSWORD: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Docker Metadata
        id: docker-metadata
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE_NAME }}
          tags: |
            type=edge
            type=sha
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=schedule,pattern={{date 'YYYYMMDD'}}

      - name: Build Image
        id: build_image
        uses: redhat-actions/buildah-build@v3
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.docker-metadata.outputs.tags }}
          labels: ${{ steps.docker-metadata.outputs.labels }}
          context: ./containers/host-maintenance
          containerfiles: |
            ./containers/host-maintenance/Dockerfile
          extra-args: |
            --disable-compression=false
            --cache-from=${{ env.IMAGE_NAME }}-cache
            --cache-to=${{ env.IMAGE_NAME }}-cache

      - name: Check images created
        run: buildah images | grep '${{ env.IMAGE_NAME }}'

      - name: Push To GHCR
        uses: redhat-actions/push-to-registry@v3
        id: push
        with:
          image: ${{ steps.build_image.outputs.image }}
          tags: ${{ steps.build_image.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}
          extra-args: |
            --disable-content-trust
