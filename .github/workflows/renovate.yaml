name: "renovate"
# Self-hosted Renovate: the CLI runs directly on the runner, authenticated as the
# tiles-owned GitHub App. Repository config is renovate.json5; see docs/renovate.md.
on:
  schedule:
    - cron: "0 10 * * *" # Daily at 1000 UTC, after the 0800 nodes-plan-apply
  workflow_dispatch: {}
concurrency:
  group: renovate
  cancel-in-progress: false
permissions: {}
jobs:
  renovate:
    runs-on: "ubuntu-latest"
    env:
      # renovate: datasource=npm depName=renovate
      RENOVATE_VERSION: "44.199.0"
    permissions:
      contents: read # actions/checkout, for the local helm-setup action
    steps:
      - name: Load secrets
        id: load_secrets
        uses: 1password/load-secrets-action@v5
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.ONEPASSWORD_SA_TOKEN }}
          APP_CLIENT_ID: "op://tiles-secrets/github-renovate-app/client-id"
          APP_PRIVATE_KEY: "op://tiles-secrets/github-renovate-app/notesPlain"

      - name: Mint GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ steps.load_secrets.outputs.APP_CLIENT_ID }}
          private-key: ${{ steps.load_secrets.outputs.APP_PRIVATE_KEY }}

      # The Node range the pinned Renovate version declares in engines.node; Renovate
      # exits on any other Node.
      - name: Renovate's Node range
        id: node_range
        shell: bash
        run: |
          echo "range=$(npm view "renovate@${RENOVATE_VERSION}" engines.node)" | tee -a "$GITHUB_OUTPUT"

      # helm for Chart.lock updates and build.sh in postUpgradeTasks, at CI's version.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/helm-setup

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node_range.outputs.range }}

      - name: Run Renovate
        shell: bash
        env:
          RENOVATE_TOKEN: ${{ steps.app_token.outputs.token }}
          RENOVATE_PLATFORM: "github"
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "required"
          RENOVATE_ALLOWED_COMMANDS: '["^ci-tools/helm-add-repos\\.sh$", "^ci-tools/helm-update-all\\.sh$", "^\\./build\\.sh$"]'
        run: |
          npx --yes "renovate@${RENOVATE_VERSION}"
