name: "taint-vms"
run-name: "Taint VMs test=${{ inputs.taint_test }} prod=${{ inputs.taint_prod }} by @${{ github.actor }}"
# Stages a cluster rebuild, applied by nodes-plan-apply (with
# metal_apply_mode=reboot). Two verbs, by one rule:
#
#   taint     -- something real that Terraform must delete and build again: the
#                VMs, their ISOs and schematics, and the bare-metal config apply
#                (the machine survives, so its config has to be actively redone).
#   state rm  -- something whose container is destroyed underneath it, so it is
#                already gone and Terraform is only holding a stale record: etcd
#                on a replaced VM, and everything inside the cluster. Asking
#                Terraform to delete these fails -- the providers that reach the
#                cluster cannot even be configured until the new one exists,
#                because their config comes from module.cluster.
#
# Either way the point is the same: the next apply must create, not update.
#
# Dynamic sets are derived from `terraform state list` so new instances are
# picked up without editing this workflow.
on:
  workflow_dispatch:
    inputs:
      taint_test:
        description: "Taint VMs in test cluster"
        type: boolean
        default: false
      taint_prod:
        description: "Taint VMs in prod cluster"
        type: boolean
        default: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_onepassword_sa_token: ${{ secrets.ONEPASSWORD_SA_TOKEN }}

concurrency:
  group: ${{ github.repository }}-taint-vms
  cancel-in-progress: false

jobs:
  taint-vms:
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - uses: "actions/checkout@v7"

      - name: Load secrets
        id: load_secrets
        uses: 1password/load-secrets-action@v4
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.ONEPASSWORD_SA_TOKEN }}
          TILES_VPN_CONFIG: "op://tiles-secrets/github-vpn-client/notesPlain"
          WORKLOAD_IDENTITY_PROVIDER: "op://tiles-secrets/gh_oidc_workload_identity/workload_identity_provider"
          SERVICE_ACCOUNT_EMAIL: "op://tiles-secrets/gh_oidc_workload_identity/service_account_email"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ steps.load_secrets.outputs.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ steps.load_secrets.outputs.SERVICE_ACCOUNT_EMAIL }}

      - uses: "hashicorp/setup-terraform@v4"
        with:
          terraform_version: "1.14.8"

      - uses: ./.github/actions/wg-quick
        id: wireguard
        with:
          wg_config: ${{ steps.load_secrets.outputs.TILES_VPN_CONFIG }}
          conf_dir: "$HOME"

      - name: Terraform init
        working-directory: "tf/nodes"
        run: |
          set -euo pipefail
          terraform init

      # Test cluster VM tainting
      - name: Taint test cluster VMs
        if: inputs.taint_test == true
        working-directory: "tf/nodes"
        run: |
          set -euo pipefail
          terraform workspace select test || terraform workspace new test

          terraform taint 'talos_image_factory_schematic.vm'
          terraform taint 'talos_image_factory_schematic.metal_amd'
          while IFS= read -r addr; do
            [ -n "$addr" ] && terraform taint "$addr"
          done < <(terraform state list | grep '^proxmox_download_file\.talos_iso\[' || true)

          terraform taint 'module.cluster.module.talos-vm["tiles-test-cp"].proxmox_virtual_environment_vm.main'
          terraform taint 'module.cluster.module.talos-vm["tiles-test-wk"].proxmox_virtual_environment_vm.main'
          # etcd lived on the VMs being replaced, so it is already gone.
          terraform state rm 'module.cluster.talos_machine_bootstrap.this'

          # Metal nodes: config re-applies byte-identical, so the apply is a no-op
          # under apply_mode="auto" and the node never rejoins the new etcd.
          # docs/bare-metal-nodes.md#rebuilds-metal-reapply--reboot
          while IFS= read -r addr; do
            [ -n "$addr" ] && terraform taint "$addr"
          done < <(terraform state list | grep -E '^module\.cluster\.module\.talos-(amd|intel)-metal\[.*\]\.talos_machine_configuration_apply\.this$' || true)

          # Everything Terraform puts inside the cluster: the CRD and Cilium
          # Helm releases, the onepassword namespace and operator secrets, the
          # cilium namespace. All destroyed with the cluster.
          while IFS= read -r addr; do
            [ -n "$addr" ] && terraform state rm "$addr"
          done < <(terraform state list | grep -E '^(helm_release|kubernetes_)' || true)

      # Prod cluster VM tainting
      - name: Taint prod cluster VMs
        if: inputs.taint_prod == true
        working-directory: "tf/nodes"
        run: |
          set -euo pipefail
          terraform workspace select prod || terraform workspace new prod

          terraform taint 'talos_image_factory_schematic.vm'
          terraform taint 'talos_image_factory_schematic.metal_amd'
          while IFS= read -r addr; do
            [ -n "$addr" ] && terraform taint "$addr"
          done < <(terraform state list | grep '^proxmox_download_file\.talos_iso\[' || true)

          terraform taint 'module.cluster.module.talos-vm["tiles-cp-1"].proxmox_virtual_environment_vm.main'
          terraform taint 'module.cluster.module.talos-vm["tiles-cp-2"].proxmox_virtual_environment_vm.main'
          terraform taint 'module.cluster.module.talos-vm["tiles-cp-3"].proxmox_virtual_environment_vm.main'
          terraform taint 'module.cluster.module.talos-vm["tiles-wk-1"].proxmox_virtual_environment_vm.main'
          terraform taint 'module.cluster.module.talos-vm["tiles-wk-2"].proxmox_virtual_environment_vm.main'
          terraform taint 'module.cluster.module.talos-vm["tiles-wk-3"].proxmox_virtual_environment_vm.main'
          # etcd lived on the VMs being replaced, so it is already gone.
          terraform state rm 'module.cluster.talos_machine_bootstrap.this'

          # Metal nodes: config re-applies byte-identical, so the apply is a no-op
          # under apply_mode="auto" and the node never rejoins the new etcd.
          # docs/bare-metal-nodes.md#rebuilds-metal-reapply--reboot
          while IFS= read -r addr; do
            [ -n "$addr" ] && terraform taint "$addr"
          done < <(terraform state list | grep -E '^module\.cluster\.module\.talos-(amd|intel)-metal\[.*\]\.talos_machine_configuration_apply\.this$' || true)

          # Everything Terraform puts inside the cluster: the CRD and Cilium
          # Helm releases, the onepassword namespace and operator secrets, the
          # cilium namespace. All destroyed with the cluster.
          while IFS= read -r addr; do
            [ -n "$addr" ] && terraform state rm "$addr"
          done < <(terraform state list | grep -E '^(helm_release|kubernetes_)' || true)

      - name: De-wireguard
        if: always()
        run: |
          set -euo pipefail
          if [ -z "${{ steps.wireguard.outputs.wg_connected }}" ]; then
            echo "No Wireguard connection established, skipping disconnection."
            exit 0
          fi
          echo "Disconnecting Wireguard..."
          time sudo wg-quick down "$HOME/wg0.conf" || true
          echo "Disconnected"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Taint VM Workflow Complete"
            echo ""
            if [ "${{ inputs.taint_test }}" == "true" ]; then
              echo "✅ Test cluster tainted (Talos schematics, Proxmox ISOs, VMs, bootstrap, metal config-apply)"
            fi
            if [ "${{ inputs.taint_prod }}" == "true" ]; then
              echo "✅ Prod cluster tainted (Talos schematics, Proxmox ISOs, VMs, bootstrap, metal config-apply)"
            fi
            if [ "${{ inputs.taint_test }}" != "true" ] && [ "${{ inputs.taint_prod }}" != "true" ]; then
              echo "ℹ️ Nothing tainted (both options were false)"
            fi
            echo ""
            echo "**Next steps:**"
            echo "- Run **nodes-plan-apply** with **apply** for the workspace you tainted, and set **\`metal_apply_mode = reboot\`** so re-applied bare-metal workers reboot and rejoin the freshly bootstrapped etcd (a plain re-apply is a no-op and leaves them orphaned)."
            echo "- See [docs/bare-metal-nodes.md](https://github.com/symmatree/tiles/blob/main/docs/bare-metal-nodes.md#rebuilds-metal-reapply--reboot) for the full rebuild runbook."
          } >> "$GITHUB_STEP_SUMMARY"
