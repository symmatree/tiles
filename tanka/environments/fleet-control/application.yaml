apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fleet-control
spec:
  project: '{{ required ".Values.cluster_name is required" .Values.cluster_name }}'
  source:
    repoURL: https://github.com/symmatree/tiles.git
    targetRevision: '{{ required ".Values.targetRevision is required" .Values.targetRevision }}'
    path: tanka
    plugin:
      env:
        - name: TK_ENV
          value: fleet-control
      parameters:
        - name: cluster_name
          string: '{{ required ".Values.cluster_name is required" .Values.cluster_name }}'
        - name: vault_name
          string: '{{ required ".Values.vault_name is required" .Values.vault_name }}'
        - name: project_id
          string: '{{ required ".Values.project_id is required" .Values.project_id }}'
        - name: app_settings
          map:
            image: 'ghcr.io/symmatree/coordinator-fleet-control:main'
            hostname: 'fleet.{{ required ".Values.cluster_name is required" .Values.cluster_name }}.symmatree.com'
            cluster_issuer: "real-cert"
            # Shared across clusters (no prefix): there is one fleet and one key, and both
            # clusters read the same vault. Created by terraform, tf/nodes/fleet-ssh-key.tf
            # -- the item it replaced was hand-made and held the key in PKCS8, which ssh
            # cannot read for ed25519 (`Load key: invalid format`, coordinator#261).
            ssh_key_secret: 'fleet-ssh-key-managed'
            # The operator passes a field label straight through when it is already a valid
            # ConfigMap key, so terraform's `private-key` field arrives under that name.
            # charts/jupyterhub consumes `public-key` from its own ssh-key item the same way.
            ssh_key_field: 'private-key'
  destination:
    server: https://kubernetes.default.svc
    namespace: fleet-control
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/warn: baseline
