# Source manifest for the CRD charts published to
# oci://ghcr.io/symmatree/tiles/charts and installed by tf/nodes/k8s-bootstrap.tf.
#
# These are the CRDs that cannot be left to the chart that ships them, because
# their consumers live in *other* Argo CD applications: a ServiceMonitor or an
# OnePasswordItem shows up all over the tree, so the type has to exist before
# the app-of-apps sync rather than arriving with one app inside it.
#
# Nothing fetched here is committed. build.py downloads at build time and emits
# chart directories under build/crd-charts/, which is gitignored.
#
# The CRD YAML goes in the chart's templates/, NOT crds/. Helm never upgrades or
# deletes anything in crds/, so a CRD parked there can only ever be created once.
#
# Fields:
#   name        chart name; becomes oci://ghcr.io/symmatree/tiles/charts/<name>,
#               published from main as version 0.0.0-branch-main
#   ref         upstream tag/branch the URLs pin. Becomes the chart appVersion.
#   urls        CRD YAML to fetch. '{ref}' is substituted. Every document in
#               every file must be a CustomResourceDefinition; build.py fails
#               otherwise, which is what catches a 404 body or an upstream file
#               that has quietly grown a Namespace or Deployment.
charts:
  - name: argo-cd-crds
    ref: v3.5.6
    description: Argo CD CRDs (Application, ApplicationSet, AppProject)
    urls:
      - https://raw.githubusercontent.com/argoproj/argo-cd/refs/tags/{ref}/manifests/crds/application-crd.yaml
      - https://raw.githubusercontent.com/argoproj/argo-cd/refs/tags/{ref}/manifests/crds/applicationset-crd.yaml
      - https://raw.githubusercontent.com/argoproj/argo-cd/refs/tags/{ref}/manifests/crds/appproject-crd.yaml

  - name: argo-workflows-crds
    ref: v4.1.6
    description: Argo Workflows CRDs (Workflow, WorkflowTemplate, CronWorkflow, and friends)
    # ALL EIGHT, and that is load-bearing. The controller starts one informer per type and
    # cache sync is all-or-nothing, so a single missing CRD stops it reconciling ANYTHING:
    # with workflowtaskresults absent it logged `failed to list *v1alpha1.WorkflowTaskResult`
    # every 40s, never touched a submitted workflow, and reported itself healthy and 1/1.
    # List against the upstream directory, not against the types you think are used --
    # workflowtaskresults is written by the executor, so nothing here references it.
    # minimal, not full. Unmodified, the full argoproj.io_workflows.yaml is 2838656 bytes
    # and the install fails with "Request entity too large: limit is 3145728". With its
    # descriptions stripped it installs (chart 0.5.0), but every kube-apiserver holds the
    # schemas in memory: on the 2.9 GB control planes that was about 300-400 MiB more per
    # apiserver, enough that a routine host-maintenance drain pushed cp-2 and cp-3 into
    # the Talos OOM controller and etcd lost its leader.
    # The minimal variant drops the OpenAPI schema, so the apiserver does not validate
    # Workflow specs -- a malformed one is accepted and fails when it runs -- and Argo CD's
    # server-side diff can report Synced for WorkflowTemplate/CronWorkflow changes it never
    # applied (argoproj/argo-cd#27625).
    urls:
      - https://raw.githubusercontent.com/argoproj/argo-workflows/refs/tags/{ref}/manifests/base/crds/minimal/argoproj.io_workflows.yaml
      - https://raw.githubusercontent.com/argoproj/argo-workflows/refs/tags/{ref}/manifests/base/crds/minimal/argoproj.io_workflowtemplates.yaml
      - https://raw.githubusercontent.com/argoproj/argo-workflows/refs/tags/{ref}/manifests/base/crds/minimal/argoproj.io_clusterworkflowtemplates.yaml
      - https://raw.githubusercontent.com/argoproj/argo-workflows/refs/tags/{ref}/manifests/base/crds/minimal/argoproj.io_cronworkflows.yaml
      - https://raw.githubusercontent.com/argoproj/argo-workflows/refs/tags/{ref}/manifests/base/crds/minimal/argoproj.io_workflowtaskresults.yaml
      - https://raw.githubusercontent.com/argoproj/argo-workflows/refs/tags/{ref}/manifests/base/crds/minimal/argoproj.io_workflowtasksets.yaml
      - https://raw.githubusercontent.com/argoproj/argo-workflows/refs/tags/{ref}/manifests/base/crds/minimal/argoproj.io_workflowartifactgctasks.yaml
      - https://raw.githubusercontent.com/argoproj/argo-workflows/refs/tags/{ref}/manifests/base/crds/minimal/argoproj.io_workfloweventbindings.yaml

  - name: cert-manager-crds
    ref: v1.21.3
    description: cert-manager CRDs (Certificate, Issuer, ClusterIssuer, and friends)
    urls:
      - https://github.com/cert-manager/cert-manager/releases/download/{ref}/cert-manager.crds.yaml

  - name: trust-manager-crds
    ref: v0.26.0
    description: trust-manager CRDs (Bundle)
    urls:
      - https://raw.githubusercontent.com/cert-manager/trust-manager/{ref}/deploy/crds/trust.cert-manager.io_bundles.yaml

  - name: gateway-api-crds
    ref: v1.6.1
    description: Gateway API standard-channel CRDs, consumed by Cilium
    # Per-CRD files rather than standard-install.yaml: from v1.6 that bundle also
    # carries a ValidatingAdmissionPolicy (vap_safeupgrades), which is not a CRD.
    # Cilium 1.20 requires Gateway API v1.6.1 or later.
    urls:
      - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/refs/tags/{ref}/config/crd/standard/gateway.networking.k8s.io_backendtlspolicies.yaml
      - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/refs/tags/{ref}/config/crd/standard/gateway.networking.k8s.io_gatewayclasses.yaml
      - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/refs/tags/{ref}/config/crd/standard/gateway.networking.k8s.io_gateways.yaml
      - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/refs/tags/{ref}/config/crd/standard/gateway.networking.k8s.io_grpcroutes.yaml
      - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/refs/tags/{ref}/config/crd/standard/gateway.networking.k8s.io_httproutes.yaml
      - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/refs/tags/{ref}/config/crd/standard/gateway.networking.k8s.io_listenersets.yaml
      - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/refs/tags/{ref}/config/crd/standard/gateway.networking.k8s.io_referencegrants.yaml
      - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/refs/tags/{ref}/config/crd/standard/gateway.networking.k8s.io_tcproutes.yaml
      - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/refs/tags/{ref}/config/crd/standard/gateway.networking.k8s.io_tlsroutes.yaml
      - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/refs/tags/{ref}/config/crd/standard/gateway.networking.k8s.io_udproutes.yaml

  - name: onepassword-crds
    ref: v1.12.1
    description: 1Password operator CRDs (OnePasswordItem)
    urls:
      - https://raw.githubusercontent.com/1Password/onepassword-operator/refs/tags/{ref}/config/crd/bases/onepassword.com_onepassworditems.yaml

  - name: nfd-crds
    ref: v0.20.1
    description: node-feature-discovery CRDs (NodeFeature, NodeFeatureGroup, NodeFeatureRule)
    urls:
      - https://raw.githubusercontent.com/kubernetes-sigs/node-feature-discovery/{ref}/deployment/base/nfd-crds/nfd-api-crds.yaml

  # No snapshot controller is installed; the NFS CSI driver still wants the
  # VolumeSnapshot types present. Replace this source if a real snapshot
  # implementation ever lands.
  - name: external-snapshotter-crds
    ref: release-6.0
    description: VolumeSnapshot CRDs, required by the NFS CSI driver
    urls:
      - https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/{ref}/client/config/crd/snapshot.storage.k8s.io_volumesnapshotclasses.yaml
      - https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/{ref}/client/config/crd/snapshot.storage.k8s.io_volumesnapshotcontents.yaml
      - https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/{ref}/client/config/crd/snapshot.storage.k8s.io_volumesnapshots.yaml
